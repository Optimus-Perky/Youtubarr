# Runs as root (no User/Group drop) - the only way to reliably open
# /dev/stdout for logging inside a container; this proxy is not
# internet-facing (see Allow below), so the reduced isolation is fine.
Port 8888
Listen 0.0.0.0
Timeout 60

DefaultErrorFile "/usr/share/tinyproxy/default.html"
StatFile "/usr/share/tinyproxy/stats.html"

# A real file, not /dev/stdout - tinyproxy's safety check refuses to log to
# a FIFO/pipe, which is what Docker's stdout is. The entrypoint tails this
# file to stdout instead, so `docker compose logs netproxy` still shows it.
LogFile "/var/log/tinyproxy.log"
LogLevel Info

PidFile "/var/run/tinyproxy/tinyproxy.pid"
MaxClients 20

# Only accept connections from the docker bridge network - this proxy exists
# so passthroughvpn's shared netns (youtubarr, redis, and the other *arr
# containers) can reach it directly on the LAN side of the VPN tunnel. It is
# not meant to be reachable from anywhere else.
Allow 172.17.0.0/16
Allow 127.0.0.1
