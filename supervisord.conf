[supervisord]
nodaemon=true
user=root

# Every program below sends its output to the container's stdout/stderr
# (/dev/fd/1 with maxbytes=0), so "docker compose logs" shows what gunicorn and
# celery are actually doing. Without this, supervisord buffers child output into
# temp files inside the container and the logs look silent even mid-sync.

[program:gunicorn]
environment=PYTHONUNBUFFERED=1
command=/usr/local/bin/gunicorn core.wsgi:application -b 127.0.0.1:8000 -w 4 --timeout 300 --access-logfile - --error-logfile -
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-worker]
environment=PYTHONUNBUFFERED=1
command=/usr/local/bin/celery -A core worker --concurrency=1 --loglevel=INFO
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:celery-beat]
environment=PYTHONUNBUFFERED=1
command=/usr/local/bin/celery -A core beat --loglevel=INFO
directory=/app
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
